[project]
name = "elsabefirst"
version = "0.1.0"
description = "React user management application with a FastAPI backend"
readme = "README.md"
authors = [
    { name = "miket-snr", email = "miket.snr@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[project.scripts]
elsabefirst = "elsabefirst:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
